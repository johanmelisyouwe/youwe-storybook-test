name: Deploy Storybook to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: pages
    cancel-in-progress: true

# Pages serves the gh-pages branch (Settings → Pages → Deploy from a branch) so
# PR previews can live next to the main site in pr-preview/ (see pr-preview.yml).
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - name: Figma sync checks (check-legacy + check-coverage)
              run: pnpm tokens && pnpm check
            - name: Build Storybook
              # Branch-based Pages runs Jekyll, which drops _-prefixed files (Vite chunks).
              run: pnpm build-storybook && touch storybook-static/.nojekyll
            - uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: storybook-static
                  branch: gh-pages
                  # Keep open PR previews when main redeploys.
                  clean-exclude: pr-preview/
                  force: false
